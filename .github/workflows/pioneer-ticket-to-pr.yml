name: Pioneer — ESI ticket to PR (with evidence)

# Jira label -> repository_dispatch -> this job -> two draft PRs on AssetPandaLLC/pioneer.
#
# Runs on a GitHub-hosted runner. Nothing is hosted: the patched frontend runs for the length of the
# job on the runner's own localhost:3000 and talks to the company's qa backend (AppSync + Cognito
# from the live registry, fetched by `bin/backend.mjs`). Every run folder (prompts, diff, timeline,
# screenshots, video, metrics row) is kept as an artifact and, when RUNS_BUCKET is set, synced to S3
# — that S3 prefix is the durable record of every run.
#
# Trigger from Jira Automation: WHEN Labels changed -> IF contains PandaAgentGraph -> Send web request
#   POST https://api.github.com/repos/<this repo>/dispatches
#   headers: Authorization: Bearer <fine-grained PAT, this repo, Contents: read+write> · Accept: application/vnd.github+json
#   body:    {"event_type":"pioneer-ticket","client_payload":{"issue_key":"{{issue.key}}"}}

run-name: ${{ github.event.client_payload.issue_key || inputs.issue_key }}${{ inputs.image_tag && format(' · image {0}', inputs.image_tag) || '' }}

on:
  repository_dispatch:
    types: [pioneer-ticket]
  workflow_dispatch:
    inputs:
      issue_key:
        description: Jira issue key (ESI2-…)
        required: true
        type: string
      dry_run:
        description: Do everything except push the branch and open the PRs
        required: false
        default: false
        type: boolean
      image_tag:
        description: Image tag for THIS run only (e.g. edge built from a branch); empty = the release pin
        required: false
        default: ''
        type: string

concurrency:
  group: pioneer-${{ github.event.client_payload.issue_key || inputs.issue_key }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # OIDC token for aws-actions/configure-aws-credentials (agent/infra/aws-gha.sh creates the role)

env:
  ISSUE_KEY: ${{ github.event.client_payload.issue_key || inputs.issue_key }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  CLAUDE_CODE_USE_BEDROCK: '1'
  PAG_ENV_PRECEDENCE: env
  PAG_QUIET_ENV: '1'
  PAG_MODEL_FAST: ${{ vars.BEDROCK_HAIKU_MODEL || 'us.anthropic.claude-haiku-4-5-20251001-v1:0' }}
  PAG_MODEL_HEAVY: ${{ vars.BEDROCK_OPUS_MODEL || 'us.anthropic.claude-opus-5' }}
  # The product checkout lives beside the agent; the agent's own state stays under agent/.
  PIONEER_DIR: ${{ github.workspace }}/pioneer
  PAG_PROFILE: nx
  PAG_PAR_DIR: ${{ github.workspace }}/agent/.par
  PAG_BASELINE_DIR: ${{ github.workspace }}/agent/.baseline
  PAG_RUNS_DIR: ${{ github.workspace }}/agent/graph/runs
  # Guards: only this remote, only draft PRs, main + a qa copy.
  PAG_ALLOWED_REMOTE: AssetPandaLLC/pioneer
  PAG_BRANCH_PREFIX: agent/
  PAG_BASE_BRANCH: main
  PAG_PR_TARGET: main
  PAG_PR_EXTRA_TARGETS: qa
  PAG_CAP_USD: ${{ vars.PAG_CAP_USD || '15' }}
  PAG_RESERVE_USD: ${{ vars.PAG_RESERVE_USD || '2' }}
  PAG_MAX_MINUTES: ${{ vars.PAG_MAX_MINUTES || '45' }}
  PAG_PATCH_MINUTES: ${{ vars.PAG_PATCH_MINUTES || '14' }}
  # A GitHub-hosted runner runs jest 2-3x slower than a laptop; give the failing test room to finish.
  PAG_REPRO_MINUTES: ${{ vars.PAG_REPRO_MINUTES || '12' }}
  PAG_JIRA_TRANSITION: ${{ vars.PAG_JIRA_TRANSITION || 'READY FOR REVIEW' }}
  PAG_UI_EVIDENCE: '1'
  PAG_APP_URL: http://localhost:3000
  # Phase C: the deploy env developers keep in the product checkout's .env.local (hosted zone, account
  # id) as KEY=value lines. Empty = the deploy node skips and browser QA stays in observe mode.
  PAG_DEPLOY_ENV: ${{ vars.PAG_DEPLOY_ENV }}
  # Static egress for the QA browser (http://user:pass@host:3128) once that IP is allow-listed on
  # qa's WAF. Empty = no proxy; QA then probes the API first and skips itself if the runner is blocked.
  PAG_BROWSER_PROXY: ${{ secrets.PAG_BROWSER_PROXY }}
  PAG_APP_EMAIL: ${{ secrets.PAG_APP_EMAIL }}
  PAG_APP_PASSWORD: ${{ secrets.PAG_APP_PASSWORD }}
  JIRA_URL: ${{ secrets.JIRA_BASE_URL || vars.JIRA_BASE_URL }}
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

jobs:
  agent:
    name: ${{ github.event.client_payload.issue_key || inputs.issue_key }}
    if: startsWith(github.event.client_payload.issue_key || inputs.issue_key, 'ESI2-')
    runs-on: ubuntu-latest
    timeout-minutes: 75   # backstop: install (~10 min cold) + the agent's own 45-minute clock
    # The pinned runtime (see agent/Dockerfile): Node, Playwright + Chromium, Xvfb, ffmpeg, Claude Code,
    # and the agent itself at /opt/panda-agent. PAG_IMAGE_TAG (repo variable) is the release pin —
    # v1.0.0 for the team's label, `edge` (built from main) for PandaAgentGraphDev.
    container:
      image: ghcr.io/jessip23/panda-agent:${{ inputs.image_tag || vars.PAG_IMAGE_TAG || 'edge' }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --shm-size=2g
    env:
      AGENT_DIR: /opt/panda-agent/agent
      # `secrets` cannot be read in a step's `if`; mirrored into env so the App step can be conditional.
      PIONEER_APP_ID: ${{ secrets.PIONEER_APP_ID }}
    # Container jobs default to `sh`; the steps use bash (`set -o pipefail`, arrays).
    defaults:
      run:
        shell: bash
    steps:
      # The agent code comes from the image (built from the tag), not from a checkout — that is what
      # makes a run reproducible. The repo is checked out only so the workflow's own files are present.
      - name: Checkout the agent repo (workflow files)
        uses: actions/checkout@v5

      # Who the agent is on GitHub. With the org's GitHub App installed on pioneer (secrets
      # PIONEER_APP_ID + PIONEER_APP_PRIVATE_KEY) a token is minted here for this run only — one hour,
      # pioneer only, and the PRs come from panda-agent[bot]. Until the App exists the fine-grained PAT
      # PIONEER_TOKEN is used and the PRs appear as its owner. Nothing else in the job knows which.
      - name: GitHub App token for pioneer (when the App is installed)
        id: app
        if: env.PIONEER_APP_ID != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PIONEER_APP_ID }}
          private-key: ${{ secrets.PIONEER_APP_PRIVATE_KEY }}
          owner: AssetPandaLLC
          repositories: pioneer

      - name: Which identity pushes to pioneer
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.PIONEER_TOKEN }}
        run: |
          echo "::add-mask::$GH_TOKEN"
          echo "PIONEER_TOKEN=$GH_TOKEN" >> "$GITHUB_ENV"
          if [ "${{ steps.app.outcome }}" = "success" ]; then
            echo "GitHub App ${{ steps.app.outputs.app-slug }} — PRs will be authored by ${{ steps.app.outputs.app-slug }}[bot]"
            echo "GIT_AUTHOR=${{ steps.app.outputs.app-slug }}[bot]" >> "$GITHUB_ENV"
            echo "GIT_EMAIL=${{ steps.app.outputs.app-slug }}[bot]@users.noreply.github.com" >> "$GITHUB_ENV"
          else
            echo "fine-grained PAT (secret PIONEER_TOKEN) — PRs will be authored by $(gh api user -q .login)"
            echo "GIT_AUTHOR=panda-agent[bot]" >> "$GITHUB_ENV"
            echo "GIT_EMAIL=panda-agent@users.noreply.github.com" >> "$GITHUB_ENV"
          fi

      - name: Checkout pioneer (full history — history mining and baselines read merges)
        uses: actions/checkout@v5
        with:
          repository: AssetPandaLLC/pioneer
          ref: main
          path: pioneer
          fetch-depth: 0
          token: ${{ env.PIONEER_TOKEN }}
          persist-credentials: true   # the agent pushes agent/* branches with this token

      # 2.2 GB of node_modules: cached on the lockfile so a warm run restores in ~1 min instead of
      # a 10-minute npm ci. First run per lockfile pays the install.
      - name: Cache pioneer node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: pioneer/node_modules
          key: pioneer-nm-${{ runner.os }}-${{ hashFiles('pioneer/package-lock.json') }}

      # nx's task cache: lint/test/build results for unchanged projects. Restored from the newest
      # previous run and re-saved every run, so the gate on the runner gets faster week over week.
      - name: Cache the nx task cache
        uses: actions/cache@v4
        with:
          path: pioneer/.nx/cache
          key: pioneer-nx-${{ runner.os }}-${{ github.run_id }}
          restore-keys: pioneer-nx-${{ runner.os }}-

      - name: Install pioneer dependencies (cache miss only — the image carries every other tool)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: cd pioneer && npm ci --no-audit --no-fund --prefer-offline

      - name: Runtime pins in this image
        run: |
          echo "image   ${{ inputs.image_tag || vars.PAG_IMAGE_TAG || 'edge' }}  ($PAG_IMAGE_REF)"
          # `edge` must be built from the commit this run is on; a stale image silently runs old agent code
          # (3437: two runs died at locate on a fix that was already on main but not yet in the image).
          if [ "${{ inputs.image_tag || vars.PAG_IMAGE_TAG || 'edge' }}" = "edge" ] && [[ "$PAG_IMAGE_REF" != *"@${{ github.sha }}" ]]; then
            echo "::error::image edge is built from ${PAG_IMAGE_REF##*@} but this run is on ${{ github.sha }} — wait for 'Build panda-agent image' to finish, then run again"
            exit 1
          fi
          echo "node    $(node --version)"
          echo "claude  $(claude --version 2>/dev/null | head -1)"
          echo "mcp     $(npm ls -g @playwright/mcp --depth=0 2>/dev/null | grep -o '@playwright/mcp@[^ ]*')"
          echo "chromium $(ls $PLAYWRIGHT_BROWSERS_PATH | tr '\n' ' ')"

      # No static keys anywhere: the job's OIDC token is exchanged for credentials that die with the job.
      # The role (agent/infra/aws-gha.sh) trusts exactly one identity; print what this run's token claims to be,
      # so a "Not authorized to perform sts:AssumeRoleWithWebIdentity" is a diff, not a guess. Claims only —
      # the token itself is never printed.
      - name: Who this run is to AWS (OIDC claims)
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          node -e 'const p=JSON.parse(Buffer.from(process.argv[1].split(".")[1],"base64url").toString());
            for (const k of ["iss","aud","sub","repository","ref","event_name","actor"]) console.log(k.padEnd(11), p[k])' "$tok"
          echo "role        ${{ secrets.AWS_ROLE_TO_ASSUME }}"

      - name: AWS credentials for Bedrock
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # Phase C. Credentials for the DEPLOY, kept apart from the Bedrock ones: a second OIDC exchange
      # into the dev account's panda-agent-deploy, then the chain into ap-cicd-cross-account-deployment
      # that pioneer's own CI uses. They are exported as PAG_DEPLOY_AWS_* — putting them in AWS_* would
      # point Claude's own calls at the dev account and every model call in the run would fail.
      # Inert until the repo variable exists: create the role with agent/infra/aws-deploy-role.sh
      # (needs IAM admin in 362202801688), then set PAG_DEPLOY_ROLE_ARN and PAG_DEPLOY_ENV.
      - name: Deploy credentials (dev account)
        if: vars.PAG_DEPLOY_ROLE_ARN != ''
        continue-on-error: true   # no deploy = observe-mode QA, never a failed run
        run: |
          tok=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          step=$(aws sts assume-role-with-web-identity --role-arn "${{ vars.PAG_DEPLOY_ROLE_ARN }}" \
                   --role-session-name "panda-agent-$ISSUE_KEY" --web-identity-token "$tok" \
                   --duration-seconds 3600 --query Credentials --output json)
          export AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$step")
          export AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$step")
          export AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$step")
          final=$(aws sts assume-role --role-arn "${{ vars.PAG_DEPLOY_TARGET_ROLE_ARN || 'arn:aws:iam::362202801688:role/ap-cicd-cross-account-deployment' }}" \
                   --role-session-name "panda-agent-$ISSUE_KEY" --duration-seconds 3600 --query Credentials --output json)
          for k in AccessKeyId:PAG_DEPLOY_AWS_ACCESS_KEY_ID SecretAccessKey:PAG_DEPLOY_AWS_SECRET_ACCESS_KEY SessionToken:PAG_DEPLOY_AWS_SESSION_TOKEN; do
            v=$(jq -r ".${k%%:*}" <<<"$final"); echo "::add-mask::$v"; echo "${k##*:}=$v" >> "$GITHUB_ENV"
          done
          echo "PAG_DEPLOY_AWS_ARN=$(AWS_ACCESS_KEY_ID=$(jq -r .AccessKeyId <<<"$final") AWS_SECRET_ACCESS_KEY=$(jq -r .SecretAccessKey <<<"$final") AWS_SESSION_TOKEN=$(jq -r .SessionToken <<<"$final") aws sts get-caller-identity --query Arn --output text)" >> "$GITHUB_ENV"

      # The backend the patched frontend will call: qa's AppSync/Cognito from the live registry.
      # Writes agent/graph/.env (VITE_APP_AWS_* only — there is no other .env in CI).
      # qa when there is no deploy role (the fix cannot run anywhere else); the agent's own backend
      # when there is, so the deploy has somewhere to land and QA can show the fix working.
      - name: Point the app at a backend
        run: |
          if [ -n "${{ vars.PAG_DEPLOY_ROLE_ARN }}" ] && node $AGENT_DIR/graph/bin/backend.mjs agent; then
            echo "app -> the agent backend: a backend fix deploys here and QA can show it working"
          else
            node $AGENT_DIR/graph/bin/backend.mjs qa
            echo "app -> qa (shared): backend fixes are QA'd in observe mode"
          fi

      - name: Jira reachability
        run: node $AGENT_DIR/graph/bin/jira-probe.mjs "$ISSUE_KEY"

      # Same probe as from a laptop: 401 = reached AppSync (bad key, expected); 403 + WAFForbidden =
      # this runner's IP is blocked by qa's WAF and browser QA will skip itself.
      - name: qa API reachability from this runner
        continue-on-error: true
        run: |
          URL=$(grep '^VITE_APP_AWS_APPSYNC_GRAPHQL_ENDPOINT=' $AGENT_DIR/graph/.env | cut -d= -f2-)
          for UA in "curl" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) HeadlessChrome/130.0.0.0 Safari/537.36" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"; do
            printf '%-14s ' "${UA%% *}"
            curl -s -o /tmp/probe.json -D /tmp/probe.h -w 'HTTP %{http_code} ' -A "$UA" -X POST "$URL" -H 'content-type: application/json' -H 'x-api-key: probe' -d '{"query":"{__typename}"}'
            grep -i 'x-amzn-errortype' /tmp/probe.h | tr -d '\r' || echo
          done

      # The agent's memory of this ticket: earlier runs' red tests are reused for $0, earlier diffs
      # are handed to patch, unmerged halves are carried. On a laptop that lives in runs/; on a fresh
      # runner it must come back from S3 or every run starts from zero (3436 on CI: $9.61, no PR,
      # for a fix the laptop had already found for $0.79).
      - name: Restore this ticket's run history
        if: vars.RUNS_BUCKET != ''
        continue-on-error: true
        run: |
          mkdir -p "agent/graph/runs/$ISSUE_KEY"
          aws s3 sync "s3://${{ vars.RUNS_BUCKET }}/runs/$ISSUE_KEY/" "agent/graph/runs/$ISSUE_KEY/" --only-show-errors --exclude "*/qa/*"
          echo "restored $(ls agent/graph/runs/$ISSUE_KEY | wc -l) earlier run(s)"

      # The file index only changes when Pioneer does: keyed on its commit, ~1 min saved per run.
      - name: Cache the file index
        id: par-cache
        uses: actions/cache@v4
        with:
          path: agent/.par/index.json
          key: pioneer-par-${{ hashFiles('pioneer/.git/HEAD', 'pioneer/.git/refs/heads/main') }}

      # A screen for the QA browser. Without one Playwright falls back to headless Chromium, whose
      # `HeadlessChrome` signature qa's WAF Bot Control rejects with 403 — the same runner's curl got
      # 401. Headed Chromium on a virtual display is what the laptop runs, and it is let through.
      - name: Virtual display for the QA browser
        run: |
          pgrep -x Xvfb >/dev/null || (Xvfb :99 -screen 0 1440x900x24 -nolisten tcp >/dev/null 2>&1 &)
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 1

      - name: Queue latency (when this run was requested vs when the agent starts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "PAG_QUEUED_AT=$(gh run view ${{ github.run_id }} --repo ${{ github.repository }} --json createdAt -q .createdAt)" >> "$GITHUB_ENV"

      - name: Run the agent
        id: agent
        env:
          GH_TOKEN: ${{ env.PIONEER_TOKEN }}
          # Live by default. Repo variable PAG_DRY_RUN=true (or the checkbox on a manual run) holds the push and the PRs.
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || (vars.PAG_DRY_RUN == 'true') }}
        run: |
          set -o pipefail
          FLAG=""; [ "$DRY" = "true" ] && FLAG="--dry-run"
          git -C pioneer config user.name  "$GIT_AUTHOR"
          git -C pioneer config user.email "$GIT_EMAIL"
          [ "${{ steps.par-cache.outputs.cache-hit }}" = "true" ] && FLAG="$FLAG --skip-index"
          code=0
          node $AGENT_DIR/graph/bin/ci.mjs "$ISSUE_KEY" --repo "$PIONEER_DIR" --base main $FLAG || code=$?
          # Exit 3 is a REFUSAL: the agent finished, found it could not settle the ticket from the code,
          # and said so on the ticket. That is a result, not a broken run — a red X here trains everyone
          # to ignore the workflow. Any other non-zero exit is a genuine failure and stays red.
          if [ "$code" = "3" ]; then echo "::notice::$ISSUE_KEY — the agent refused and commented on the ticket; nothing was pushed"; exit 0; fi
          exit "$code"

      - name: Job summary
        if: always()
        continue-on-error: true
        run: |
          RUN_DIR="${{ steps.agent.outputs.run_dir }}"
          {
            echo "## $ISSUE_KEY — $( [ "${{ steps.agent.outputs.pr_url }}" != "" ] && echo "PR ${{ steps.agent.outputs.pr_url }}" || echo "no PR (${{ steps.agent.outputs.refusal || 'see log' }})" )"
            echo "evidence: **${{ steps.agent.outputs.evidence || 'n/a' }}** · spent \$${{ steps.agent.outputs.spent || '0' }} · ${{ steps.agent.outputs.elapsed || '?' }}s"
            echo
            [ -n "$RUN_DIR" ] && cat "$RUN_DIR/timeline.md" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          true

      - name: Keep the run folder (prompts, diff, screenshots, video, metrics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pioneer-${{ env.ISSUE_KEY }}-${{ github.run_id }}
          path: |
            agent/graph/runs/${{ env.ISSUE_KEY }}/**
            agent/graph/runs/metrics.csv
          retention-days: 90
          if-no-files-found: ignore

      # The bank of information: every run folder and its metrics row, forever, queryable later.
      - name: Sync the run to S3
        if: always() && vars.RUNS_BUCKET != ''
        continue-on-error: true
        run: |
          RUN_DIR="${{ steps.agent.outputs.run_dir }}"
          # memory (restored on reruns) and evidence (never restored) are different things — two prefixes
          # runs/ keeps what a rerun reads back (phase state, patch.diff, the frozen repro test + its logs);
          # images, video and traces go to evidence/ only.
          [ -n "$RUN_DIR" ] && aws s3 sync "$RUN_DIR" "s3://${{ vars.RUNS_BUCKET }}/runs/$ISSUE_KEY/$(basename "$RUN_DIR")/" --only-show-errors --exclude "qa/*" --exclude "evidence/*.png" --exclude "evidence/*.webm" --exclude "evidence/*.gif" --exclude "evidence/*.zip"
          [ -n "$RUN_DIR" ] && [ -d "$RUN_DIR/evidence" ] && aws s3 sync "$RUN_DIR/evidence" "s3://${{ vars.RUNS_BUCKET }}/evidence/$ISSUE_KEY/$(basename "$RUN_DIR")/" --only-show-errors
          tail -n 1 agent/graph/runs/metrics.csv > /tmp/row.csv
          aws s3 cp /tmp/row.csv "s3://${{ vars.RUNS_BUCKET }}/metrics/$ISSUE_KEY-${{ github.run_id }}.csv" --only-show-errors
          head -n 1 agent/graph/runs/metrics.csv | aws s3 cp - "s3://${{ vars.RUNS_BUCKET }}/metrics/_header.csv" --only-show-errors
