name: Build panda-agent image

# Every pinned runtime the agent runs on, as one image on GHCR:
#   ghcr.io/<owner>/panda-agent:v1.0.0   from a tag push  (prod pins these)
#   ghcr.io/<owner>/panda-agent:edge     from main         (the PandaAgentGraphDev label)
# Rebuild is deliberate: a version bump is a commit + a tag, gated by the agent's self-tests inside
# the Dockerfile. Nothing about the runtime changes between two runs of the same tag.

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['agent/**', '.github/workflows/build-image.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then TAG="${{ github.ref_name }}"; else TAG=edge; fi
          echo "image=ghcr.io/$OWNER/panda-agent" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          build-args: AGENT_REF=${{ github.ref_name }}@${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the exact base-image digest (pin it in the Dockerfile on the next bump)
        run: docker buildx imagetools inspect ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }} | head -20
