name: Refresh codebase index

# After every merge to the default branch, rebuild the compact map agents read
# and open a review-only PR if it changed. Never merge.

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - ".github/agentic/codebase-index.md"
      - ".github/agentic/run/**"

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: refresh-codebase-index
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The secrets context is not allowed in step-level `if:`, only in job-level `env:`.
    env:
      HAS_GITHUB_APP: ${{ secrets.APP_ID != '' }}
    steps:
      - name: Optional GitHub App token
        id: app-token
        if: env.HAS_GITHUB_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token || github.token }}
          fetch-depth: 1

      - name: Rebuild index from latest default branch
        run: python3 .github/agentic/scripts/build_codebase_index.py
        env:
          REPO_ROOT: ${{ github.workspace }}
          INDEX_OUT: .github/agentic/codebase-index.md
          WRITE_SNAPSHOT: "0"

      - name: Open review-only PR when the map changed
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .github/agentic/codebase-index.md; then
            echo "Index unchanged"
            exit 0
          fi
          BASE="${{ github.event.repository.default_branch }}"
          # Include the attempt so a re-run never collides with a branch a failed attempt already pushed.
          BRANCH="agent/index/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add .github/agentic/codebase-index.md
          git commit -m "chore: refresh agent codebase index from ${BASE}"
          git push -u origin "HEAD:${BRANCH}"
          mkdir -p /tmp
          cat > /tmp/index-pr-body.md <<EOF
          Refresh the compact codebase map used by agents.

          Generated from \`${BASE}\` at \`${GITHUB_SHA}\`.
          Each Jira-to-PR run also rebuilds a live index from its checkout.
          This snapshot is a hint so agents stay aligned after merges.

          Do not merge until a human reviews.
          EOF
          # open_pr.sh runs as a child process, so these must be exported, not just assigned.
          export ISSUE_KEY="INDEX"
          export BRANCH
          export BASE_BRANCH="${BASE}"
          export PR_TITLE="chore: refresh agent codebase index"
          export PR_BODY_FILE="/tmp/index-pr-body.md"
          export PR_LABELS="agent-pr,needs-human-review"
          bash .github/agentic/scripts/open_pr.sh
