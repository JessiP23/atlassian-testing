name: Pioneer — move tickets to Done when their agent PR is merged

# The other half of the loop. "Pioneer — ESI ticket to PR" opens the PR and moves the ticket to
# review; this moves it to Done when a HUMAN merges that PR, and says so on the ticket.
#
# Why a poll and not `pull_request: closed`: that event fires in the repo that owns the PR —
# AssetPandaLLC/pioneer — and this workflow lives here, so it would never fire. Polling the
# agent's own PRs (branch prefix agent/) with the same token the agent pushes with needs nothing
# installed in pioneer. Idempotent: a ticket already in Done is left alone (jira-transition exits 0).
#
# The agent still cannot merge anything. This only reacts to a merge a person performed.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      since_hours:
        description: Look back this many hours for merged agent PRs (default 1)
        required: false
        default: '1'
        type: string
      dry_run:
        description: List what would move, move nothing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pioneer-merged
  cancel-in-progress: false

env:
  PAG_ENV_PRECEDENCE: env
  PAG_QUIET_ENV: '1'
  JIRA_URL: ${{ secrets.JIRA_BASE_URL || vars.JIRA_BASE_URL }}
  JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
  JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
  PIONEER: AssetPandaLLC/pioneer

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent/graph/package-lock.json
      - run: npm --prefix agent/graph ci --no-audit --no-fund --prefer-offline

      # Merged in the window, head branch agent/*, base main. The ticket key is in the branch name
      # (agent/ESI2-1234-fix). The qa copy of the same fix is a second PR on the same ticket; both
      # resolve to one key and the second transition is a no-op.
      - name: Merged agent PRs
        id: merged
        env:
          GH_TOKEN: ${{ secrets.PIONEER_TOKEN }}
        run: |
          HOURS="${{ inputs.since_hours || '1' }}"
          SINCE=$(date -u -d "-${HOURS} hour" +%Y-%m-%dT%H:%M:%SZ)
          gh pr list --repo "$PIONEER" --state merged --base main --limit 100 \
            --search "head:agent/ merged:>=$SINCE" \
            --json number,url,headRefName,mergedBy,mergedAt \
            -q '.[] | select(.headRefName | startswith("agent/")) | [(.headRefName | capture("(?<k>[A-Z][A-Z0-9]+-[0-9]+)").k), .url, .mergedBy.login] | @tsv' \
            | sort -u > /tmp/merged.tsv || true
          echo "since $SINCE: $(wc -l < /tmp/merged.tsv) merged agent PR(s)"
          cat /tmp/merged.tsv

      - name: Move each ticket to Done and say who merged
        if: ${{ !inputs.dry_run }}
        run: |
          while IFS=$'\t' read -r KEY URL WHO; do
            [ -z "$KEY" ] && continue
            echo "== $KEY  $URL  merged by ${WHO:-a reviewer}"
            (cd agent/graph && node bin/jira-transition.mjs "$KEY" \
              --to "${{ vars.PAG_JIRA_DONE || 'Done,Closed,Resolved,Complete,Completed' }}" \
              --comment "Merged by @${WHO:-a reviewer}: ${URL}. Moving this ticket to Done.")
          done < /tmp/merged.tsv

      - name: Summary
        if: always()
        run: |
          { echo "### merged agent PRs"; echo; echo '```'; cat /tmp/merged.tsv 2>/dev/null || echo none; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
